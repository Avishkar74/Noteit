version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: snabbly-backend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      # BASE_URL: set this to your laptop/server IP so QR codes point
      # to the correct address the phone can reach, e.g.:
      #   BASE_URL=http://192.168.1.42:3000
      # If not set, the backend derives the host from each incoming request,
      # which works correctly when running without Docker.
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/api/health', res => res.resume())"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
